# NoteBookRAG Configuration

# ========================================
# OpenAI API Configuration
# ========================================
# API
openai.api.base.url=https://api.openai.com/v1
openai.embedding.model=text-embedding-3-small
openai.embedding.dimensions=1536
openai.llm.model=gpt-4o-mini
openai.request.timeout.seconds=30
openai.max.retries=3

# ========================================
# Chunking Configuration
# ========================================
chunking.default.size=500
chunking.default.overlap=50
chunking.min.size=100
chunking.max.size=2000

# ========================================
# Retrieval Configuration
# ========================================
retrieval.default.topk=3
retrieval.min.topk=1
retrieval.max.topk=100
retrieval.similarity.threshold=0.0

# ========================================
# Storage Configuration
# ========================================
storage.base.path=data/vectors
storage.serialization.format=java

# ========================================
# Document Processing Configuration
# ========================================
document.max.size.mb=50
document.supported.types=txt,pdf,docx

# ========================================
# Logging Configuration
# ========================================
logging.level=INFO
logging.format=human-readable

# ========================================
# Application Metadata
# ========================================
app.name=NotebookRAG
app.version=1.0.0
app.description=Java RAG Pipeline
